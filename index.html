<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AASA VISION AI</title>
  <style>
    :root { --bg: #07060d; --card: #120e24; --purple: #9333ea; --cyan: #06b6d4; --text: #f3f4f6; --muted: #9ca3af; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; background: linear-gradient(90deg, #fff, #c084fc, var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .tabs { display: flex; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--muted); font-weight: 700; font-size: 0.85rem; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: linear-gradient(135deg, var(--purple), #6366f1); color: #fff; }
    .panel { display: none; background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; margin-bottom: 24px; }
    .panel.active { display: block; }
    label { font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; display: block; }
    textarea { width: 100%; background: #0b0917; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff; padding: 12px; font-size: 0.9rem; resize: none; margin-bottom: 14px; outline: none; }
    .ratios { display: flex; gap: 8px; margin-bottom: 16px; }
    .ratio-btn { flex: 1; padding: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--muted); font-size: 0.75rem; font-weight: 700; cursor: pointer; text-align: center; }
    .ratio-btn.active { background: rgba(147, 51, 234, 0.25); border-color: var(--purple); color: #fff; }
    .btn-main { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--purple), var(--cyan)); border: none; border-radius: 12px; color: #fff; font-size: 0.95rem; font-weight: 800; cursor: pointer; }
    .btn-main:disabled { opacity: 0.5; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .chip { font-size: 0.7rem; padding: 6px 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: var(--muted); cursor: pointer; }
    .chip.active { background: var(--purple); color: #fff; border-color: #d946ef; }
    .upload-box { border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 14px; }
    .preview-box { display: none; text-align: center; margin-bottom: 14px; }
    .preview-box img { max-width: 100%; max-height: 220px; border-radius: 10px; }
    .showcase { display: none; margin-top: 16px; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid rgba(147, 51, 234, 0.4); text-align: center; }
    .showcase img { width: 100%; max-height: 400px; object-fit: contain; display: block; }
    .showcase-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #0e0b1b; }
    .btn-dl { background: var(--purple); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; text-decoration: none; }
    .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .gallery-item { background: #000; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    .gallery-item img { width: 100%; height: 140px; object-fit: cover; display: block; }
    .gallery-item div { padding: 6px 8px; display: flex; justify-content: space-between; font-size: 0.65rem; background: var(--card); }
  </style>
</head>
<body>
  <div class="header">
    <h1>AASA VISION AI</h1>
    <p>Cinematic AI Image Generator & Photo Editor</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab1Btn" onclick="setTab('gen')">Image Generator</button>
    <button class="tab-btn" id="tab2Btn" onclick="setTab('edit')">Photo Editor</button>
  </div>

  <!-- TAB 1: GENERATOR -->
  <div class="panel active" id="genPanel">
    <label>Describe Your Image</label>
    <textarea id="genPrompt" rows="3" placeholder="A futuristic cybernetic samurai in neon rain, cinematic purple lighting, 8k..."></textarea>
    <label>Aspect Ratio</label>
    <div class="ratios">
      <div class="ratio-btn active" onclick="setRatio(this, '1:1')">1:1</div>
      <div class="ratio-btn" onclick="setRatio(this, '3:4')">3:4</div>
      <div class="ratio-btn" onclick="setRatio(this, '9:16')">9:16</div>
      <div class="ratio-btn" onclick="setRatio(this, '16:9')">16:9</div>
    </div>
    <button class="btn-main" id="genBtn" onclick="generateImage()">Generate Vision</button>
    <div class="showcase" id="genShowcase">
      <img id="genImg" alt="Generated Vision">
      <div class="showcase-bar">
        <span id="genTag" style="font-size:0.75rem; color:var(--muted)">1:1 Aspect</span>
        <a id="genDl" class="btn-dl" download="aasa-vision.png" target="_blank">Download</a>
      </div>
    </div>
  </div>

  <!-- TAB 2: EDITOR -->
  <div class="panel" id="editPanel">
    <label>Upload Your Photo</label>
    <input type="file" id="fileIn" accept="image/*" style="display:none" onchange="previewUpload(event)">
    <div class="upload-box" id="uploadBox" onclick="document.getElementById('fileIn').click()">
      <p style="font-size:0.85rem; font-weight:700;">Tap to Choose Photo</p>
      <p style="font-size:0.7rem; color:var(--muted);">Select from gallery</p>
    </div>
    <div class="preview-box" id="previewBox">
      <img id="previewImg" alt="Reference">
      <button onclick="clearUpload()" style="margin-top:6px; background:none; border:none; color:#f87171; font-size:0.75rem; cursor:pointer">Remove Photo</button>
    </div>
    <label>Editing Instructions</label>
    <textarea id="editPrompt" rows="2" placeholder="Describe edits (e.g. Sharp jawline, dark suit, cinematic background)..."></textarea>
    <label>Quick Modifiers</label>
    <div class="chips">
      <span class="chip" onclick="toggleChip(this)">Textured Fade</span>
      <span class="chip" onclick="toggleChip(this)">Heavy Stubble</span>
      <span class="chip" onclick="toggleChip(this)">Italian Tuxedo</span>
      <span class="chip" onclick="toggleChip(this)">Athletic Build</span>
      <span class="chip" onclick="toggleChip(this)">Neon Penthouse</span>
      <span class="chip" onclick="toggleChip(this)">Moody Rim Light</span>
    </div>
    <button class="btn-main" id="editBtn" onclick="editPhoto()">Transform Photo</button>
    <div class="showcase" id="editShowcase">
      <img id="editImg" alt="Edited Result">
      <div class="showcase-bar">
        <span style="font-size:0.75rem; color:var(--muted)">AI Transformation</span>
        <a id="editDl" class="btn-dl" download="aasa-edited.png" target="_blank">Download</a>
      </div>
    </div>
  </div>

  <!-- GALLERY -->
  <label style="margin-top:10px;">Session Gallery (<span id="count">0</span>)</label>
  <div class="gallery-grid" id="gallery"></div>

  <script>
    let ratio = '1:1', uploaded = null, activeChips = [];
    function setTab(t) {
      document.getElementById('tab1Btn').classList.toggle('active', t === 'gen');
      document.getElementById('tab2Btn').classList.toggle('active', t === 'edit');
      document.getElementById('genPanel').classList.toggle('active', t === 'gen');
      document.getElementById('editPanel').classList.toggle('active', t === 'edit');
    }
    function setRatio(el, r) {
      document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      ratio = r;
    }
    function toggleChip(el) {
      el.classList.toggle('active');
      const val = el.innerText;
      activeChips = el.classList.contains('active') ? [...activeChips, val] : activeChips.filter(c => c !== val);
    }
    function previewUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = ev => {
        uploaded = ev.target.result;
        document.getElementById('previewImg').src = uploaded;
        document.getElementById('uploadBox').style.display = 'none';
        document.getElementById('previewBox').style.display = 'block';
      };
      r.readAsDataURL(file);
    }
    function clearUpload() {
      uploaded = null;
      document.getElementById('fileIn').value = '';
      document.getElementById('uploadBox').style.display = 'block';
      document.getElementById('previewBox').style.display = 'none';
    }
    function getDims(r) {
      if (r === '16:9') return { w: 1280, h: 720 };
      if (r === '9:16') return { w: 720, h: 1280 };
      if (r === '3:4') return { w: 768, h: 1024 };
      return { w: 1024, h: 1024 };
    }
    function generateImage() {
      const p = document.getElementById('genPrompt').value.trim();
      if (!p) return alert('Please enter a description.');
      const btn = document.getElementById('genBtn');
      btn.disabled = true; btn.innerText = 'Creating Vision...';
      const { w, h } = getDims(ratio);
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + ', cinematic masterpiece, 8k')}?width=${w}&height=${h}&seed=${Math.floor(Math.random()*999999)}&nologo=true`;
      const img = new Image();
      img.src = url;
      img.onload = () => {
        btn.disabled = false; btn.innerText = 'Generate Vision';
        document.getElementById('genImg').src = url;
        document.getElementById('genDl').href = url;
        document.getElementById('genTag').innerText = ratio + ' Ratio';
        document.getElementById('genShowcase').style.display = 'block';
        addToGallery(url, 'Generated');
      };
      img.onerror = () => { btn.disabled = false; btn.innerText = 'Generate Vision'; alert('Generation timed out. Try again.'); };
    }
    function editPhoto() {
      if (!uploaded) return alert('Please upload a photo first.');
      const p = document.getElementById('editPrompt').value.trim();
      if (!p && activeChips.length === 0) return alert('Add instructions or select chips.');
      const btn = document.getElementById('editBtn');
      btn.disabled = true; btn.innerText = 'Transforming...';
      const full = [p, activeChips.join(', '), 'photorealistic cinematic portrait'].filter(Boolean).join(' | ');
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent('Portrait photo edit: ' + full)}?width=800&height=1000&seed=${Math.floor(Math.random()*999999)}&nologo=true`;
      const img = new Image();
      img.src = url;
      img.onload = () => {
        btn.disabled = false; btn.innerText = 'Transform Photo';
        document.getElementById('editImg').src = url;
        document.getElementById('editDl').href = url;
        document.getElementById('editShowcase').style.display = 'block';
        addToGallery(url, 'Edited');
      };
      img.onerror = () => { btn.disabled = false; btn.innerText = 'Transform Photo'; alert('Transformation timed out. Try again.'); };
    }
    function addToGallery(url, type) {
      const g = document.getElementById('gallery');
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = `<img src="${url}"><div><span>${type}</span><a href="${url}" target="_blank" style="color:var(--cyan);text-decoration:none">View</a></div>`;
      g.prepend(item);
      document.getElementById('count').innerText = g.children.length;
    }
  </script>
</body>
</html>
